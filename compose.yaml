services:
  agent:
    build: .
    env_file: .env
    command: "npm run dev"
    ports:
      - 4111:4111
      - 4112:4112
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: package.json

  llm:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - 11434:11434
    environment:
      MODEL: ${MODEL:-llama3.1:8b}
    healthcheck:
      test: ollama show $${MODEL}
      interval: 5s
      timeout: 3s
      retries: 30
  runner:
    image: curlimages/curl:8.15.0
    depends_on:
      llm:
        condition: service_healthy
    command:
      [
        "http://llm:11434/api/generate",
        "-d",
        '{"model": "llama3.1:8b", "prompt": "say: ready"}',
      ]
    restart: "no"
volumes:
  ollama:
